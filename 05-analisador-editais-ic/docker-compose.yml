services:
  postgres:
    image: postgres:16-alpine
    container_name: editais_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: editais_ic
      POSTGRES_USER: editais
      POSTGRES_PASSWORD: editais
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U editais -d editais_ic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
