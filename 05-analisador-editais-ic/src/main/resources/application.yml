server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: analisador-editais-ic
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/editais_ic}
    username: ${DATABASE_USERNAME:editais}
    password: ${DATABASE_PASSWORD:editais}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    endpoint: https://generativelanguage.googleapis.com/v1beta/models
    connect-timeout-ms: 10000
    read-timeout-ms: 30000
    prompt-version: v1.0.0
    mock-fallback: true
  scraper:
    connect-timeout-ms: ${SCRAPER_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${SCRAPER_READ_TIMEOUT_MS:15000}
    max-bytes: ${SCRAPER_MAX_BYTES:5242880} # 5 MB
    rate-limit-ms: ${SCRAPER_RATE_LIMIT_MS:1000}
    max-redirects: 5
    user-agent: "Mozilla/5.0 (compatible; AnalisadorEditaisIC/1.0; +https://github.com/AndreLuismain/Java-Projects)"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    br.com.andreluismain.editaisic: DEBUG
    org.springframework.web: INFO
