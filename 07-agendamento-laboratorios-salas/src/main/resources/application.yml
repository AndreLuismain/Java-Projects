server:
  port: ${PORT:8080}

spring:
  application:
    name: agendamento-laboratorios-salas
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:agendamentodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: false

agendamento:
  min-notice-minutes: ${MIN_NOTICE_MINUTES:15}
  max-duration-hours: ${MAX_DURATION_HOURS:12}
  max-advance-days: ${MAX_ADVANCE_DAYS:30}

logging:
  level:
    br.com.andreluismain.agendamento: INFO
