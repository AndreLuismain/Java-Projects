spring:
  application:
    name: simulador-transacoes-pix
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:pixdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: false

server:
  port: ${PORT:8080}

pix:
  security-limit: ${PIX_SECURITY_LIMIT:500000}

logging:
  level:
    br.com.andreluismain.pix: INFO
