server:
  port: ${PORT:8080}

spring:
  application:
    name: api-orquestracao-relatorios-ic
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:relatoriosicdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: false

llm:
  api-key: ${LLM_API_KEY:mock-key}
  model: ${LLM_MODEL:gemini-1.5-flash}

logging:
  level:
    br.com.andreluismain.relatoriosic: INFO
