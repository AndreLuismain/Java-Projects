server:
  port: ${PORT:8080}

spring:
  application:
    name: motor-recomendacao-pesquisas
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:recomendacaodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: false

recomendacao:
  pipeline-version: v1.0.0
  deterministic-weight: 0.70
  semantic-weight: 0.30

llm:
  api-key: ${LLM_API_KEY:mock-key}
  model: ${LLM_MODEL:gemini-1.5-flash}

logging:
  level:
    br.com.andreluismain.recomendacao: INFO
